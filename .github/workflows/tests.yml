name: tests

on:
  pull_request:
  push:
    # allen/*: pushed with a deploy key; a PR the bot opens needs a manual
    # approval to run in a public repo, the push run covers the same commit
    branches: [main, "allen/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Server tests
        run: >
          uv run --python 3.12
          --with-requirements server/requirements.txt
          --with-requirements deploy/hosted/requirements.txt
          --with httpx --with pytest
          python -m pytest server/tests -q
